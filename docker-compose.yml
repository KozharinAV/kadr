services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kadr
      POSTGRES_PASSWORD: kadr
      POSTGRES_DB: kadr
    ports:
      - '55432:5432'
    volumes:
      - kadr-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kadr -d kadr']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '26379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kadr
      MINIO_ROOT_PASSWORD: kadrsecret
    ports:
      - '19100:9000'
      - '19101:9001'
    volumes:
      - kadr-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./kadr-back
    environment: &api-env
      PORT: 3000
      DATABASE_URL: postgres://kadr:kadr@postgres:5432/kadr
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:19100
      S3_ACCESS_KEY: kadr
      S3_SECRET_KEY: kadrsecret
      S3_BUCKET: kadr
      S3_REGION: ru-central1
      S3_FORCE_PATH_STYLE: 'true'
      METRICS_PORT: 3001
      ADMIN_EMAIL: admin@kadr.local
      ADMIN_PASSWORD: Admin123!
    ports:
      - '13100:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: ./kadr-back
    command: ['node', 'dist/worker.js']
    environment: *api-env
    ports:
      - '13011:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./kadr-front

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '18088:80'
    depends_on:
      - api
      - web

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '19090:9090'
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '13030:3000'
    depends_on:
      - prometheus

volumes:
  kadr-pg:
  kadr-minio:
