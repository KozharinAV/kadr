<h2 mat-dialog-title class="head">
  <span>{{ user.email }}</span>
  <span class="actions">
    <button
      mat-icon-button
      type="button"
      [matTooltip]="'admin.edit' | transloco"
      [attr.aria-label]="'admin.edit' | transloco"
      (click)="edit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
        />
      </svg>
    </button>
    <button
      mat-icon-button
      type="button"
      mat-dialog-close
      [matTooltip]="'admin.close' | transloco"
      [attr.aria-label]="'admin.close' | transloco"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
        />
      </svg>
    </button>
  </span>
</h2>
<mat-dialog-content>
  <p>
    <span class="label">{{ 'admin.role' | transloco }}</span>
    {{ 'roles.' + user.role | transloco }}
  </p>
</mat-dialog-content>
