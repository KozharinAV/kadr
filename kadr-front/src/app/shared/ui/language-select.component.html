<button
  type="button"
  class="lang"
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="('lang.label' | transloco) + ': ' + current().label"
>
  {{ current().code }}
</button>
<mat-menu #menu="matMenu" xPosition="before">
  @for (option of options; track option.id) {
    <button
      mat-menu-item
      type="button"
      [class.active]="option.id === lang()"
      (click)="setLang(option.id)"
    >
      {{ option.label }}
    </button>
  }
</mat-menu>
